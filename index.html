<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SLR Studio – PRISMA, Taksonomi, System Map</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
:root{--bg:#f7f5f0;--fg:#1d2433;--pn:#ffffff;--ac:#14506b;--bd:#c9d3d8;--ex:#fbe9df;--exb:#b8572a;--mut:#5b6672}
@media(prefers-color-scheme:dark){:root{--bg:#121a1f;--fg:#e6edf1;--pn:#1a252c;--ac:#6fc0e0;--bd:#33454f;--ex:#34241c;--exb:#e38b5d;--mut:#9aa9b3}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 Georgia,'Times New Roman',serif}
main{max-width:1000px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:30px;margin:0 0 4px;color:var(--ac)}h2{font-size:21px;color:var(--ac);margin:34px 0 10px;border-bottom:2px solid var(--bd);padding-bottom:4px}
p.sub{margin:0 0 18px;color:var(--mut)}
.panel{background:var(--pn);border:1px solid var(--bd);border-radius:6px;padding:16px;margin:12px 0}
label{display:block;font-weight:bold;margin:12px 0 4px}small{color:var(--mut);font-weight:normal}
textarea,input[type=text],input[type=number]{width:100%;padding:8px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
button{margin-top:14px;background:var(--ac);color:var(--bg);border:0;padding:11px 22px;border-radius:4px;font:bold 15px system-ui;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--exb);outline-offset:2px}
.fc{display:grid;grid-template-columns:1fr 1fr;gap:10px 28px;align-items:stretch}
.bx{border:2px solid var(--ac);background:var(--pn);border-radius:4px;padding:10px 12px;font-size:14px}
.bx.ex{border-color:var(--exb);background:var(--ex)}.bx b{display:block;color:var(--ac)}.bx.ex b{color:var(--exb)}
.bx ul{margin:4px 0 0;padding-left:18px}.ar{grid-column:1;text-align:center;color:var(--ac);font-size:20px;line-height:1}
.ph{grid-column:1/-1;font:bold 13px system-ui;color:var(--mut);margin-top:8px}
@media(max-width:620px){.fc{grid-template-columns:1fr}}
.tree,.tree ul{list-style:none;margin:0;padding-left:22px;border-left:2px solid var(--bd)}.tree{border:0;padding:0}
.tree li{margin:6px 0}.tree .cl{font-weight:bold}.tree .tm{color:var(--mut)}
svg{width:100%;height:auto;background:var(--pn);border:1px solid var(--bd);border-radius:6px}svg text{fill:var(--fg);font:11px system-ui}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border:1px solid var(--bd);padding:6px;text-align:left;vertical-align:top}
#st{color:var(--mut);margin-top:10px}
</style>
</head>
<body>
<main>
<h1>SLR Studio</h1>
<p class="sub">Unggah jurnal PDF. Semua diproses di browser Anda, tidak ada file yang dikirim ke server.</p>

<div class="panel">
<label for="rq">Research question <small>(satu pertanyaan per baris)</small></label>
<textarea id="rq" rows="3">What are the capabilities required for digital transformation?
How do those capabilities facilitate digital transformation success?</textarea>
<label for="inc">Kata kunci inklusi <small>(pisahkan dengan koma)</small></label>
<input type="text" id="inc" value="digital transformation, capabilit">
<label for="exc">Kata kunci eksklusi <small>(opsional)</small></label>
<input type="text" id="exc" value="">
<label for="min">Minimal kemunculan kata inklusi di full text <small>(untuk eligibility assessment)</small></label>
<input type="number" id="min" value="5" min="1">
<label for="files">File PDF jurnal <small>(boleh banyak sekaligus)</small></label>
<input type="file" id="files" accept="application/pdf" multiple>
<button id="go">Analisis jurnal</button>
<div id="st" role="status"></div>
</div>

<div id="out"></div>
</main>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const list=s=>s.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
const count=(t,k)=>t.split(k).length-1;
const STOP=new Set(('the of and to in a is for that with as on by this are be or from at an it we which not can has have were was their these also been more such than other our its may use used using based study results data one two between however within both into et al fig table research paper article journal review literature section figure university copyright elsevier springer wiley licensee mdpi yang dan di ke dari untuk pada dengan adalah ini itu dalam atau juga oleh sebagai dapat akan tidak ada para http https doi www will would should could their there they them what when where while whose after before over under through each many most some only very just like does done make made well first second third among across further thus therefore since because then pages page volume issue').split(' '));

async function readPdf(file){
  const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
  let text='',title='';
  try{const m=await pdf.getMetadata();if(m.info&&m.info.Title&&m.info.Title.length>15)title=m.info.Title}catch(e){}
  for(let p=1;p<=Math.min(pdf.numPages,40);p++){
    const c=await(await pdf.getPage(p)).getTextContent();
    if(p===1&&!title){
      const h=Math.max(...c.items.map(i=>i.transform[3]||0));
      title=c.items.filter(i=>Math.abs((i.transform[3]||0)-h)<0.6).map(i=>i.str).join(' ').trim();
    }
    text+=c.items.map(i=>i.str).join(' ')+'\n';
  }
  if(title.length<10)title=text.trim().slice(0,100);
  const m=text.match(/abstract[:\s\u2014-]*([\s\S]{200,1800})/i);
  return{title,text,abs:m?m[1]:text.slice(0,1800)};
}

function tally(arr){const o={};arr.forEach(x=>o[x]=(o[x]||0)+1);return Object.entries(o)}
function reasonBox(r){return tally(r).map(([k,v])=>`<li>${esc(k)} (n=${v})</li>`).join('')||'<li>–</li>'}

function flowchart(rq,n0,dup,ex1,n1,ex2,n2,inc){
  const a='<div class="ar">↓</div><div></div>';
  return `<div class="fc">
  <div class="ph">Problem statement</div>
  <div class="bx" style="grid-column:1/-1"><b>Research question</b>${rq.map(esc).join('<br>')}</div>
  <div class="ph">Article identification</div>
  <div class="bx"><b>Artikel yang diunggah</b>n=${n0}</div>
  <div class="bx ex"><b>Dikeluarkan sebelum screening (n=${dup})</b><ul><li>Duplikat judul</li></ul></div>${a}
  <div class="ph">Article screening</div>
  <div class="bx"><b>Screening judul &amp; abstrak</b>n=${n0-dup}</div>
  <div class="bx ex"><b>Dikeluarkan (n=${ex1.length})</b><ul>${reasonBox(ex1)}</ul></div>${a}
  <div class="bx"><b>Eligibility assessment (full text)</b>n=${n1}</div>
  <div class="bx ex"><b>Dikeluarkan (n=${ex2.length})</b><ul>${reasonBox(ex2)}</ul></div>${a}
  <div class="ph">Article selection</div>
  <div class="bx"><b>Artikel masuk final review</b>n=${inc}</div><div></div>
  </div>`;
}

function topTerms(docs,N){
  const df={},tf={};
  docs.forEach(d=>{
    const w=d.text.toLowerCase().match(/[a-z]{4,}/g)||[],seen=new Set();
    for(let i=0;i<w.length;i++){
      if(STOP.has(w[i]))continue;
      const c=[w[i]];if(i+1<w.length&&!STOP.has(w[i+1]))c.push(w[i]+' '+w[i+1]);
      c.forEach(t=>{tf[t]=(tf[t]||0)+1;if(!seen.has(t)){seen.add(t);df[t]=(df[t]||0)+1}});
    }
  });
  const min=docs.length>1?Math.min(5,docs.length*2):4;
  const sc=Object.keys(tf).filter(t=>tf[t]>=min).map(t=>[t,df[t]*Math.log(1+tf[t])*(t.includes(' ')?1.3:1)]).sort((a,b)=>b[1]-a[1]);
  const sel=[];
  for(const[t]of sc){if(sel.length>=N)break;if(sel.some(s=>s.includes(t)||t.includes(s)))continue;sel.push(t)}
  return sel.map(t=>({t,df:df[t]}));
}

function cluster(terms,text){
  const words=text.toLowerCase().split(/\s+/),ch=[];
  for(let i=0;i<words.length;i+=150)ch.push(words.slice(i,i+150).join(' '));
  const sets=terms.map(x=>new Set(ch.map((c,i)=>c.includes(x.t)?i:-1).filter(i=>i>=0)));
  const sim=(a,b)=>{let n=0;sets[a].forEach(i=>{if(sets[b].has(i))n++});const u=sets[a].size+sets[b].size-n;return u?n/u:0};
  const k=Math.min(5,Math.max(2,Math.round(terms.length/5)));
  const seeds=[0];
  while(seeds.length<k){
    let best=-1,bs=9;
    terms.forEach((_,i)=>{if(seeds.includes(i))return;const m=Math.max(...seeds.map(s=>sim(i,s)));if(m<bs){bs=m;best=i}});
    seeds.push(best);
  }
  const groups=seeds.map(s=>({name:terms[s].t,items:[s]}));
  terms.forEach((_,i)=>{if(seeds.includes(i))return;let bi=0,bv=-1;seeds.forEach((s,gi)=>{const v=sim(i,s);if(v>bv){bv=v;bi=gi}});groups[bi].items.push(i)});
  return{groups,sim};
}

function taxonomyHTML(rq,terms,groups){
  return `<ul class="tree"><li class="cl">${esc(rq[0]||'Topik penelitian')}<ul>`+groups.map(g=>
    `<li><span class="cl">${esc(g.name)}</span><ul>`+g.items.map(i=>`<li>${esc(terms[i].t)} <span class="tm">(${terms[i].df} artikel)</span></li>`).join('')+'</ul></li>').join('')+'</ul></li></ul>';
}

function systemMap(terms,groups,sim){
  const COL=['#1f78b4','#e31a1c','#33a02c','#ff7f00','#6a3d9a'],cx=450,cy=330,pos={};
  let s=`<svg viewBox="0 0 900 660" role="img" aria-label="System map"><g>`,e='',n='';
  groups.forEach((g,gi)=>{
    const a=gi/groups.length*2*Math.PI-Math.PI/2,gx=cx+Math.cos(a)*190,gy=cy+Math.sin(a)*190;
    e+=`<line x1="${cx}" y1="${cy}" x2="${gx}" y2="${gy}" stroke="${COL[gi]}" stroke-width="3"/>`;
    const m=g.items.length;
    g.items.forEach((ti,j)=>{
      const b=a+(m>1?(j/(m-1)-.5)*2.2:0),tx=gx+Math.cos(b)*(95+(j%2)*28),ty=gy+Math.sin(b)*(95+(j%2)*28);
      pos[ti]=[tx,ty,gi];
      e+=`<line x1="${gx}" y1="${gy}" x2="${tx}" y2="${ty}" stroke="${COL[gi]}" opacity=".5"/>`;
      n+=`<circle cx="${tx}" cy="${ty}" r="5" fill="${COL[gi]}"/><text x="${tx}" y="${ty-9}" text-anchor="middle">${esc(terms[ti].t)}</text>`;
    });
    n+=`<circle cx="${gx}" cy="${gy}" r="14" fill="${COL[gi]}"/><text x="${gx}" y="${gy+28}" text-anchor="middle" style="font-weight:bold;font-size:13px">${esc(g.name)}</text>`;
  });
  const ids=Object.keys(pos).map(Number);
  for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++){
    const A=ids[i],B=ids[j];
    if(pos[A][2]!==pos[B][2]&&sim(A,B)>0.2)e+=`<line x1="${pos[A][0]}" y1="${pos[A][1]}" x2="${pos[B][0]}" y2="${pos[B][1]}" stroke="#888" stroke-dasharray="4 3" opacity=".6"/>`;
  }
  n+=`<circle cx="${cx}" cy="${cy}" r="30" fill="#14506b"/><text x="${cx}" y="${cy+4}" text-anchor="middle" style="fill:#fff;font-weight:bold">Topik</text>`;
  return s+e+n+'</g></svg><p class="sub">Garis putus-putus menunjukkan istilah dari kelompok berbeda yang sering muncul berdekatan.</p>';
}

$('go').onclick=async()=>{
  const files=[...$('files').files],st=$('st');
  if(!files.length){st.textContent='Pilih minimal satu file PDF dulu.';return}
  const rq=$('rq').value.split('\n').map(x=>x.trim()).filter(Boolean),inc=list($('inc').value),exc=list($('exc').value),minHits=+$('min').value||1;
  const docs=[];
  for(let i=0;i<files.length;i++){
    st.textContent=`Membaca PDF ${i+1} dari ${files.length}: ${files[i].name}`;
    try{docs.push({name:files[i].name,...await readPdf(files[i])})}
    catch(e){docs.push({name:files[i].name,title:files[i].name,text:'',abs:''})}
  }
  // Identification
  const seen=new Set();let dup=0;const recs=[];
  docs.forEach(d=>{const k=d.title.toLowerCase().replace(/\W+/g,'');if(seen.has(k))dup++;else{seen.add(k);recs.push(d)}});
  // Screening judul & abstrak
  const ex1=[],s1=[];
  recs.forEach(d=>{
    const ta=(d.title+' '+d.abs).toLowerCase();
    if(exc.some(k=>ta.includes(k)))ex1.push('Memuat kata kunci eksklusi');
    else if(inc.length&&!inc.some(k=>ta.includes(k)))ex1.push('Judul/abstrak tidak memuat kata kunci inklusi');
    else s1.push(d);
  });
  // Eligibility full text
  const ex2=[],fin=[];
  s1.forEach(d=>{
    if(d.text.length<500)ex2.push('Full text tidak dapat dibaca');
    else if(inc.length&&inc.reduce((a,k)=>a+count(d.text.toLowerCase(),k),0)<minHits)ex2.push(`Pembahasan topik kurang dari ${minHits} kemunculan`);
    else fin.push(d);
  });
  let h=`<h2>1. PRISMA flowchart</h2>`+flowchart(rq,docs.length,dup,ex1,s1.length,ex2,fin.length,fin.length);
  if(fin.length){
    const terms=topTerms(fin,Math.min(30,8+fin.length*2));
    if(terms.length>=4){
      const{groups,sim}=cluster(terms,fin.map(d=>d.text).join(' '));
      h+=`<h2>2. Taksonomi</h2><div class="panel">${taxonomyHTML(rq,terms,groups)}</div>`;
      h+=`<h2>3. System map</h2>${systemMap(terms,groups,sim)}`;
    }else h+='<h2>2. Taksonomi</h2><p>Teks belum cukup untuk membentuk taksonomi. Tambahkan lebih banyak jurnal.</p>';
    h+=`<h2>4. Tabel artikel terpilih</h2><table><tr><th>No</th><th>Judul</th><th>File</th></tr>`+fin.map((d,i)=>`<tr><td>${i+1}</td><td>${esc(d.title)}</td><td>${esc(d.name)}</td></tr>`).join('')+'</table>';
  }else h+='<p>Tidak ada artikel yang lolos. Longgarkan kata kunci inklusi atau turunkan batas kemunculan.</p>';
  $('out').innerHTML=h;st.textContent='Selesai.';
  $('out').scrollIntoView({behavior:'smooth'});
};
</script>
</body>
</html>
